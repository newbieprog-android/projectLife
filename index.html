<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0F0F0F" />
    <script>
      (function () {
        var theme = 'dark';
        try { if (localStorage.getItem('project-life-theme') === 'light') theme = 'light'; } catch (_) {}
        document.documentElement.className = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#F3F1E8' : '#0F0F0F';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Project Life — Experiments in making life better</title>
    <meta
      name="description"
      content="Experiments in making life better. A personal laboratory of things being built, thought about, shipped, and started again."
    />
    
    <link rel="canonical" href="https://projectlife.xyz" />

    <!-- Open Graph -->
<meta property="og:site_name" content="Project Life" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Project Life" />
<meta
  property="og:description"
  content="Building simple, lovable, complete products for everyday life."
/>
<meta property="og:url" content="https://projectlife.xyz" />
<meta property="og:image" content="https://projectlife.xyz/og-image.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Project Life" />
<meta
  name="twitter:description"
  content="Experiments in making life better. A personal digital laboratory."
/>
<meta name="twitter:image" content="https://projectlife.xyz/og-image.png" />

    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" sizes="180x180" />

    <!-- Progressive Web App Manifest -->
<link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (JSON-LD) -->
    

    <!-- Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
